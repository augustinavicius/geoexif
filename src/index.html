<!DOCTYPE html>
<html lang="en">
<head>
    <title>GEOEXIF</title>
    <link rel="icon" type="image/x-icon" href="./images/icon.ico">
    <link rel="stylesheet" href="./styles/custom.css">
    <link rel="stylesheet" href="./styles/sass.css">
    <link rel="stylesheet" href="./styles/leaflet.css">
    <link rel="stylesheet" href="./styles/leaflet-zoombox.css">

    <!-- Leaflet and plugins (browser globals) -->
    <script src="./leaflet-src.js"></script>
    <script src="./scripts/vendor/leaflet-zoombox.js"></script>
    <script src="./scripts/vendor/leaflet-edgebuffer.js"></script>
    <script src="./scripts/vendor/leaflet-nogap.js"></script>

    <!-- App renderer -->
    <script src="./scripts/renderer.js"></script>
</head>
<body>
    <!--Image Options Modal-->
    <div class="modal" id="imageOptionsModal">
        <div class="modal-background"></div>
        <div class="modal-content" id="imageOptionsModalContent"></div>
        <button class="modal-close is-large" aria-label="close" onclick="renderer.closeImageOptionsModal()"></button>
    </div>

    <!--Main View-->
    <div id="mainView">
        <!--Navigation Bar-->
        <div id="navbar">
            <!--Header-->
            <div id="imageListHeader">
                <span style="float:left;" class="ml-1 mt-1">
                    <button class="button is-small is-rounded" onclick="renderer.selectAllImages()">Select All</button>
                    <button class="button is-small is-rounded" onclick="renderer.inverseImageSelection()">Inverse Selection</button>
                </span>
                <span style="float:right;" class="mr-1 mt-1">
                    <button class="button is-danger is-small is-rounded is-inverted" onclick="renderer.removeImage()">
                        <span class="icon is-small"><i class="fa-solid fa-minus"></i></span>
                    </button>
                </span>
            </div>

            <!--Import Progress-->
            <div id="importProgress" class="is-hidden">
                <p class="is-size-7 has-text-white mb-1" id="importProgressText">Importing…</p>
                <progress class="progress is-primary is-small mb-0" value="0" max="100" id="importProgressBar"></progress>
            </div>

            <!--Image List-->
            <div class="list has-overflow-ellipsis" id="imageList"></div>

            <!--Navbar Toggle-->
            <button class="button is-small is-rounded m-2" onclick="renderer.navBarControl()" id="navbarControl">
                <span class="icon is-small">
                    <i class="fa-solid fa-chevron-left" id="navbarControlIcon"></i>
                </span>
            </button>
        </div>

        <!--Map View-->
        <div id="mapView">
            <div id="map"></div>
        </div>
    </div>

    <!--Footer Status Bar-->
    <div id="footer">
        <div class="content pl-1 pr-1 has-text-white is-size-7">
            <span style="float:left;" id="footerUpdateText"></span>
            <span style="float:right;" id="bottomRightStatusBar"></span>
        </div>
    </div>
</body>
</html>
